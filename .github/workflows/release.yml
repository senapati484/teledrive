name: Release Build

on:
  push:
    branches:
      - main
      - pro
      - '0.*'
      - '[0-9]+.[0-9]+.[0-9]+'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── 1. Build Desktop Platforms (macOS, Windows, Linux) ─────────────────────
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            args: '--target universal-apple-darwin --bundles dmg'
          - platform: 'windows-latest'
            os_name: 'windows'
            args: '--bundles nsis,msi'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
            args: '--bundles deb,appimage,rpm'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            rpm

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npx tauri build ${{ matrix.args }}

      - name: Standardize and stage deliverables
        shell: bash
        run: |
          mkdir -p staging
          echo "=== Organizing deliverables for ${{ matrix.os_name }} ==="

          if [ "${{ matrix.os_name }}" = "macos" ]; then
            DMG_FILE=$(find src-tauri/target -name "*.dmg" -not -name "rw.*" | head -n 1)
            if [ -n "$DMG_FILE" ]; then
              cp "$DMG_FILE" staging/teledrive.dmg
              echo "✓ Copied $DMG_FILE -> staging/teledrive.dmg"
            else
              echo "::error::No DMG found"
              exit 1
            fi
          fi

          if [ "${{ matrix.os_name }}" = "windows" ]; then
            SETUP_FILE=$(find src-tauri/target -name "*setup.exe" -o -name "*Setup.exe" | head -n 1)
            MSI_FILE=$(find src-tauri/target -name "*.msi" | head -n 1)
            
            if [ -n "$SETUP_FILE" ]; then
              cp "$SETUP_FILE" staging/teledrive-setup.exe
              echo "✓ Copied $SETUP_FILE -> staging/teledrive-setup.exe"
            fi
            if [ -n "$MSI_FILE" ]; then
              cp "$MSI_FILE" staging/teledrive.msi
              echo "✓ Copied $MSI_FILE -> staging/teledrive.msi"
            fi
          fi

          if [ "${{ matrix.os_name }}" = "linux" ]; then
            DEB_FILE=$(find src-tauri/target -name "*.deb" | head -n 1)
            RPM_FILE=$(find src-tauri/target -name "*.rpm" | head -n 1)
            APPIMG_FILE=$(find src-tauri/target -name "*.AppImage" | head -n 1)

            if [ -n "$DEB_FILE" ]; then
              cp "$DEB_FILE" staging/teledrive.deb
              echo "✓ Copied $DEB_FILE -> staging/teledrive.deb"
            fi
            if [ -n "$RPM_FILE" ]; then
              cp "$RPM_FILE" staging/teledrive.rpm
              echo "✓ Copied $RPM_FILE -> staging/teledrive.rpm"
            fi
            if [ -n "$APPIMG_FILE" ]; then
              cp "$APPIMG_FILE" staging/teledrive.AppImage
              echo "✓ Copied $APPIMG_FILE -> staging/teledrive.AppImage"
            fi
          fi

          echo "=== Staged files for ${{ matrix.os_name }} ==="
          ls -lh staging/

      - name: Upload platform deliverables
        uses: actions/upload-artifact@v7
        with:
          name: deliverables-${{ matrix.os_name }}
          path: staging/*
          if-no-files-found: error
          retention-days: 7

  # ─── 2. Build Android APK (Parallel) ─────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
      JAVA_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ -d "$NDK_HOME" ] && [ -f "$NDK_HOME/source.properties" ]; then
            echo "✓ Android NDK is already installed at $NDK_HOME"
          else
            echo "Installing Android NDK 27.1.12297006 with retries..."
            for attempt in 1 2 3; do
              echo "Attempt $attempt of 3..."
              if $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"; then
                echo "✓ Android NDK installed successfully"
                break
              fi
              echo "⚠ NDK install failed on attempt $attempt, cleaning temporary files and retrying in 10s..."
              rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/27.1.12297006" 2>/dev/null || true
              sleep 10
            done
          fi
          test -d "$NDK_HOME"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: Pre-download and verify Gradle wrapper
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-8.14.3-bin/cv11ve7ro1n3o1j4so8xd9n66"
          mkdir -p "$DIST_DIR"
          if [ ! -f "$DIST_DIR/gradle-8.14.3-bin.zip.ok" ]; then
            echo "Pre-fetching Gradle 8.14.3 distribution..."
            curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 \
              -o "$DIST_DIR/gradle-8.14.3-bin.zip" \
              https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          fi
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android APK (release)
        run: npx tauri android build --apk --ci

      - name: Standardize and stage Android deliverables
        run: |
          mkdir -p staging
          RELEASE_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" staging/teledrive.apk
            echo "✓ Copied $RELEASE_APK -> staging/teledrive.apk"
          fi
          ls -lh staging/

      - name: Upload Android deliverables
        uses: actions/upload-artifact@v7
        with:
          name: deliverables-android
          path: staging/*
          if-no-files-found: warn
          retention-days: 7

  # ─── 3. Build iOS IPA (Parallel) ─────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Ensure Xcode build environment
        run: |
          which xcodegen || brew install xcodegen
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which cargo) /usr/local/bin/cargo || true
          sudo ln -sf $(which rustc) /usr/local/bin/rustc || true
          sudo ln -sf $(which xcodegen) /usr/local/bin/xcodegen || true
          echo "/opt/homebrew/bin" | sudo tee -a /etc/paths >/dev/null || true
          echo "$HOME/.cargo/bin" | sudo tee -a /etc/paths >/dev/null || true

      - name: Initialize and regenerate iOS project
        run: |
          npm run tauri ios init -- --ci --skip-targets-install
          xcodegen generate --spec src-tauri/gen/apple/project.yml

      - name: Build iOS App for Device
        id: build_device
        continue-on-error: true
        run: |
          echo "Building iOS physical device application in release mode..."
          xcodebuild -project src-tauri/gen/apple/teledrive.xcodeproj \
            -scheme teledrive_iOS \
            -configuration release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build iOS App for Simulator (Fallback)
        if: steps.build_device.outcome != 'success'
        run: |
          echo "Building iOS simulator application as companion/fallback..."
          npx tauri ios build --target aarch64-sim --debug --ci

      - name: Standardize and stage iOS deliverables (.IPA)
        run: |
          mkdir -p staging
          VERSION=$(node -p "require('./package.json').version")
          
          APP_PATH=""
          if [ -d "build/derivedData/Build/Products/release-iphoneos/TeleDrive.app" ]; then
            APP_PATH="build/derivedData/Build/Products/release-iphoneos/TeleDrive.app"
          elif [ -d "build/derivedData/Build/Products/Release-iphoneos/TeleDrive.app" ]; then
            APP_PATH="build/derivedData/Build/Products/Release-iphoneos/TeleDrive.app"
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/derivedData src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "TeleDrive.app" -path "*iphoneos*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/derivedData src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "TeleDrive.app" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/derivedData src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "✓ Found .app at: $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH" 2>/dev/null || true
            TMP_DIR=$(mktemp -d)
            mkdir -p "$TMP_DIR/Payload"
            cp -R "$APP_PATH" "$TMP_DIR/Payload/"
            (cd "$TMP_DIR" && zip -r -q "$GITHUB_WORKSPACE/staging/teledrive.ipa" Payload)
            cp "$GITHUB_WORKSPACE/staging/teledrive.ipa" "$GITHUB_WORKSPACE/staging/teledrive-v${VERSION}.ipa"
            rm -rf "$TMP_DIR"
            echo "✓ Created staging/teledrive.ipa"
          else
            echo "::warning::No app found to package into IPA"
          fi
          ls -lh staging/

      - name: Upload iOS deliverables
        uses: actions/upload-artifact@v7
        with:
          name: deliverables-ios
          path: staging/*
          if-no-files-found: warn
          retention-days: 7

  # ─── 4. Consolidate, Package Distribution & Release ──────────────────────────
  package-distribution:
    name: Package Distribution & Release
    needs: [build-desktop, build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download all platform deliverables
        uses: actions/download-artifact@v8
        with:
          path: all-deliverables

      - name: Organize files into distribution/v<version>/
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          DIST_DIR="distribution/${TAG}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "DIST_DIR=${DIST_DIR}" >> $GITHUB_ENV

          echo "========================================================"
          echo "📦 Packaging TeleDrive Distribution for ${TAG}"
          echo "========================================================"

          mkdir -p "$DIST_DIR"

          # Flatten all downloaded deliverables into distribution/v<version>/
          find all-deliverables -type f \( \
            -name "teledrive.dmg" -o \
            -name "teledrive-setup.exe" -o \
            -name "teledrive.msi" -o \
            -name "teledrive.deb" -o \
            -name "teledrive.rpm" -o \
            -name "teledrive.AppImage" -o \
            -name "teledrive.apk" -o \
            -name "teledrive.ipa" \
          \) -exec cp -v {} "$DIST_DIR/" \;

          # Clean up any potential duplicates
          cd "$DIST_DIR"
          sha256sum teledrive* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

          # Create a standalone zip of the version directory for 1-click SourceForge upload
          cd distribution
          zip -r "teledrive-${TAG}-distribution.zip" "${TAG}"
          cd -

          echo "========================================================"
          echo "📁 Final distribution contents:"
          ls -lh "$DIST_DIR"
          echo "========================================================"

      - name: Upload Complete Distribution Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: teledrive-${{ env.TAG }}-distribution
          path: |
            ${{ env.DIST_DIR }}/*
            distribution/teledrive-${{ env.TAG }}-distribution.zip
          retention-days: 90
