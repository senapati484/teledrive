name: Build macOS DMG

on:
  push:
    branches:
      - main
      - pro
      - '0.*'
      - '[0-9]+.[0-9]+.[0-9]+'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target architecture (universal, aarch64, x86_64)'
        required: false
        default: 'universal'
        type: choice
        options:
          - universal
          - aarch64
          - x86_64

jobs:
  build-mac:
    name: Build macOS Universal DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri macOS app
        run: |
          TARGET_FLAG="--target universal-apple-darwin"
          if [ "${{ github.event.inputs.target_arch }}" = "aarch64" ]; then
            TARGET_FLAG="--target aarch64-apple-darwin"
          elif [ "${{ github.event.inputs.target_arch }}" = "x86_64" ]; then
            TARGET_FLAG="--target x86_64-apple-darwin"
          fi
          echo "Building with $TARGET_FLAG..."
          npx tauri build $TARGET_FLAG --bundles dmg

      - name: Organize deliverables into distribution/v<version>/
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIST_DIR="distribution/v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DIST_DIR=${DIST_DIR}" >> $GITHUB_ENV
          mkdir -p "$DIST_DIR"

          echo "Looking for built DMG..."
          DMG_FILE=$(find src-tauri/target -name "*.dmg" -not -name "rw.*" 2>/dev/null | head -n 1)

          if [ -n "$DMG_FILE" ]; then
            echo "Found DMG: $DMG_FILE"
            cp "$DMG_FILE" "$DIST_DIR/teledrive.dmg"
            echo "✓ Staged $DIST_DIR/teledrive.dmg"
          else
            echo "::error::No DMG file found in src-tauri/target"
            exit 1
          fi

          # Clean any old duplicate files from distribution root
          rm -f distribution/TeleDrive_* distribution/teledrive.dmg 2>/dev/null || true

          # Generate checksum
          cd "$DIST_DIR"
          shasum -a 256 teledrive.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

          ls -lh "$DIST_DIR"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: teledrive-macos-v${{ env.VERSION }}
          path: |
            ${{ env.DIST_DIR }}/teledrive.dmg
            ${{ env.DIST_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

