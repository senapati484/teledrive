name: Build iOS IPA & Simulator

on:
  push:
    branches:
      - main
      - pro
      - '0.*'
      - '[0-9]+.[0-9]+.[0-9]+'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'locales/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (all, device, simulator)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - device
          - simulator

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS App & IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Ensure Xcode build environment
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          
          which xcodegen || brew install xcodegen
          
          # Make sure node, npm, cargo, and rustc are in standard paths for Xcode script phases
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which cargo) /usr/local/bin/cargo || true
          sudo ln -sf $(which rustc) /usr/local/bin/rustc || true
          sudo ln -sf $(which xcodegen) /usr/local/bin/xcodegen || true
          
          # Ensure subshells inherit Homebrew and Cargo bin paths
          echo "/opt/homebrew/bin" | sudo tee -a /etc/paths >/dev/null || true
          echo "$HOME/.cargo/bin" | sudo tee -a /etc/paths >/dev/null || true

      - name: Initialize and regenerate iOS project
        run: |
          npm run tauri ios init -- --ci --skip-targets-install
          # Force Xcode project to adhere to projectFormat: xcode14_0 (objectVersion 56)
          xcodegen generate --spec src-tauri/gen/apple/project.yml
          grep "objectVersion" src-tauri/gen/apple/teledrive.xcodeproj/project.pbxproj

      - name: Build iOS App (Device - aarch64)
        id: build_device
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'device' }}
        continue-on-error: true
        run: |
          echo "Building iOS physical device application..."
          npx tauri ios build --target aarch64 --no-sign --debug --ci

      - name: Build iOS App (Simulator - aarch64-sim)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator' || steps.build_device.outcome != 'success' }}
        run: |
          echo "Building iOS simulator application..."
          npx tauri ios build --target aarch64-sim --debug --ci

      - name: Package Deliverables (Direct .IPA and Simulator App)
        run: |
          mkdir -p release-dist/ios
          VERSION=$(node -p "require('./package.json').version")
          echo "Packaging iOS installation deliverables for version v${VERSION}..."
          
          is_valid_app() {
            [ -n "$1" ] && [ -d "$1" ] && [ -f "$1/Info.plist" ] && [ -f "$1/TeleDrive" ]
          }

          APP_PATH=""
          # 1. Search for a valid device build (*iphoneos*)
          for cand in \
            "src-tauri/gen/apple/build/arm64/TeleDrive.app" \
            $(find build/derivedData src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "TeleDrive.app" -path "*iphoneos*" 2>/dev/null); do
            if is_valid_app "$cand"; then
              APP_PATH="$cand"
              break
            fi
          done

          # 2. Fall back to valid simulator build (*iphonesimulator*)
          if [ -z "$APP_PATH" ]; then
            for cand in \
              "src-tauri/gen/apple/build/arm64-sim/TeleDrive.app" \
              $(find build/derivedData src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "TeleDrive.app" 2>/dev/null); do
              if is_valid_app "$cand"; then
                APP_PATH="$cand"
                break
              fi
            done
          fi
          
          if is_valid_app "$APP_PATH"; then
            echo "✓ Found valid .app bundle at: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"
            # Apply ad-hoc signature
            codesign --force --deep --sign - "$APP_PATH" 2>/dev/null || true
            
            TMP_DIR=$(mktemp -d)
            mkdir -p "$TMP_DIR/Payload"
            cp -R "$APP_PATH" "$TMP_DIR/Payload/"
            
            # 1. Standard canonical teledrive.ipa (matching teledrive.apk / teledrive.dmg)
            (cd "$TMP_DIR" && zip -r -q "$GITHUB_WORKSPACE/release-dist/ios/teledrive.ipa" Payload)
            cp "$GITHUB_WORKSPACE/release-dist/ios/teledrive.ipa" "$GITHUB_WORKSPACE/release-dist/teledrive.ipa"
            
            # 2. Versioned IPA
            cp "$GITHUB_WORKSPACE/release-dist/ios/teledrive.ipa" "$GITHUB_WORKSPACE/release-dist/ios/teledrive-v${VERSION}.ipa"
            cp "$GITHUB_WORKSPACE/release-dist/ios/teledrive.ipa" "$GITHUB_WORKSPACE/release-dist/teledrive-v${VERSION}.ipa"
            
            rm -rf "$TMP_DIR"
            echo "✓ Created teledrive.ipa and teledrive-v${VERSION}.ipa"
          else
            echo "::error::No valid .app bundle found containing Info.plist and TeleDrive executable"
            exit 1
          fi

          # Optional companion: package simulator app zip if simulator was built
          SIM_APP="src-tauri/gen/apple/build/arm64-sim/TeleDrive.app"
          if [ ! -d "$SIM_APP" ]; then
            SIM_APP=$(find src-tauri/gen/apple/build ~/Library/Developer/Xcode/DerivedData -name "TeleDrive.app" -path "*iphonesimulator*" 2>/dev/null | head -n 1)
          fi
          if is_valid_app "$SIM_APP"; then
            /usr/bin/ditto -c -k --keepParent "$SIM_APP" release-dist/ios/teledrive-v${VERSION}-ios-simulator.zip
            cp release-dist/ios/teledrive-v${VERSION}-ios-simulator.zip release-dist/teledrive-ios-simulator.zip
            echo "✓ Created teledrive-ios-simulator.zip companion"
          fi

          echo "=== Release distribution contents ==="
          ls -lh release-dist/ios/

          if [ ! -f release-dist/ios/teledrive.ipa ]; then
            echo "::error::teledrive.ipa was not found in release-dist/ios/!"
            exit 1
          fi

          IPA_SIZE=$(stat -f%z release-dist/ios/teledrive.ipa 2>/dev/null || stat -c%s release-dist/ios/teledrive.ipa)
          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "::error::teledrive.ipa is too small ($IPA_SIZE bytes), must be at least 1MB"
            exit 1
          fi

      - name: Upload iOS artifacts (.IPA)
        uses: actions/upload-artifact@v7
        with:
          name: teledrive-ios-builds
          path: |
            release-dist/ios/*
          if-no-files-found: error
          retention-days: 30

