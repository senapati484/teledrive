name: Update download stats

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SourceForge stats (2026-06-21 -> today)
        run: |
          START="2026-06-21"
          END="$(date -u +%F)"
          curl -fsSL \
            "https://sourceforge.net/projects/teledrive/files/stats/json?start_date=${START}&end_date=${END}&os_by_country=false" \
            -o /tmp/stats.json

          TOTAL=$(jq '.total // ([.downloads[][1]] | add) // 0' /tmp/stats.json)
          echo "Total downloads ${START}..${END}: ${TOTAL}"

          mkdir -p .github/stats
          jq -n --argjson t "$TOTAL" \
            '{schemaVersion: 1, label: "downloads", message: ($t | tostring), color: "brightgreen"}' \
            > .github/stats/downloads.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stats/downloads.json
          git diff --cached --quiet || git commit -m "chore(stats): update download count [skip ci]"
          git push
