name: Feature Request
description: Suggest an enhancement, improvement, or new capability for TeleDrive
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much detail as possible to help us evaluate and prioritize it.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is this feature request related to a problem or limitation you encountered?
      placeholder: Currently, when managing files in TeleDrive, I cannot...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Expected Behavior
      description: Describe what you would like to happen and how you envision this feature working.
      placeholder: I would like TeleDrive to provide an option to...
    validations:
      required: true
  - type: checkboxes
    id: target_platforms
    attributes:
      label: Target Platform(s)
      description: Which platforms should this feature apply to?
      options:
        - label: macOS
        - label: Windows
        - label: Linux
        - label: Android
        - label: iOS
  - type: textarea
    id: mockups
    attributes:
      label: UI / UX Mockup & Visuals
      description: Describe any layout ideas, or drag & drop screenshots/mockups here if applicable.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: What other workarounds or tools have you tried?
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any extra references, API documentation, or links.
