name: Feature Request
description: Suggest an idea or enhancement for TeleDrive
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much detail as possible.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: I'd like TeleDrive to support...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Have you considered any alternative solutions or features?
  - type: dropdown
    id: target_platform
    attributes:
      label: Target Platform(s)
      description: Which platforms would benefit from this enhancement?
      options:
        - All Platforms (Cross-platform)
        - Desktop (macOS, Windows, Linux)
        - Mobile (Android & iOS)
        - macOS only
        - Windows only
        - Linux only
        - Android only
        - iOS only
  - type: textarea
    id: context
    attributes:
      label: Additional Context or Mockups
      description: Add any other context, mockups, or screenshots about the feature request here.
